stages:
  generate_dataset_with_label_counts:
    foreach:
#        - { model: "google/gemma-7b", dataset: "tatsu-lab/alpaca", split: "train[:1000]", output: "/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt" }
#       - { model: "mistralai/Mistral-7B-Instruct-v0.2", dataset: "tatsu-lab/alpaca", split: "train[:1000]", output: "/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_mistral_with_counts.pt" }
        - { model: "meta-llama/Meta-Llama-3-8B-Instruct", dataset: "tatsu-lab/alpaca", split: "train[:1000]", output: "/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt" }
    do:
      cmd: >
        python generate_dataset.py
        --model ${item.model}
        --dataset ${item.dataset}
        --split ${item.split}
        --output ${item.output}
        --max_length 512
        --log_level INFO

  train_binned_predictors_trail:
     foreach:
       - {layer: 'layer_8', hidden_dim: 512}
       - {layer: 'layer_9', hidden_dim: 512}
       - {layer: 'layer_10', hidden_dim: 512}
       - {layer: 'layer_11', hidden_dim: 512}
       - {layer: 'layer_12', hidden_dim: 512}
       - {layer: 'layer_13', hidden_dim: 512}
       - {layer: 'layer_14', hidden_dim: 512}
       - {layer: 'layer_15', hidden_dim: 512}
     do:
       cmd: >
         python bines.py
         --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt
         --layer_name ${item.layer}
         --output_dir results/binned_predictor_trail_${item.layer}_hidden${item.hidden_dim}
         --hidden_dim ${item.hidden_dim}
         --learning_rate 1e-3
         --batch_size 32
         --num_epochs 30
         --seed 42
         --min_loss_improvement 0.001
         --use_amp
         --use_wandb
         --wandb_project embeddings-length-predictor
         --do_eval
         --do_train
         --early_stopping_patience 5
       deps:
         - bines.py

  train_binned_predictors_agg:
     foreach:
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 128 }
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 128 }
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 256 }
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 256 }
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512 }
       - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512 }
     do:
       cmd: >
         python bines_agg.py
         --data_path 
         --layer_names ${item.layers}
         --aggregation ${item.agg}
         --output_dir results/binned_predictor_${item.agg}_hidden${item.hidden_dim}
         --hidden_dim ${item.hidden_dim}
         --learning_rate 1e-3
         --batch_size 32
         --num_epochs 30
         --seed 42
         --min_loss_improvement 0.001
         --use_amp
         --use_wandb
         --wandb_project embeddings-length-predictor
         --do_train
         --do_eval
         --early_stopping_patience 5
       deps:
         - bines_agg.py

  evaluate_pia_models:
     foreach:
       - { model: "meta-llama/Meta-Llama-3-8B-Instruct", max_new_tokens: 512 }
     do:
       cmd: >
         python pia.py
         --model_id ${item.model}
         --metadata_path ./trail_dataset_mistral_with_counts.pt
         --max_samples 1000
         --max_new_tokens ${item.max_new_tokens}
         --use_wandb
         --wandb_project pia-evaluator
         --wandb_name pia-${item.model}
       deps:
         - pia.py

  # Length threshold ablation studies
  ablation_graph_length_thresholds:
    foreach:
      # Testing multiple thresholds with fully connected graph across all datasets
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 0, length_upper_threshold: 40, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 40, length_upper_threshold: 80, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 80, length_upper_threshold: 120, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 120, length_upper_threshold: 240, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 240, length_upper_threshold: 400, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 400, length_upper_threshold: 600, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt', dataset_name: 'llama' }
      
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 0, length_upper_threshold: 40, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 40, length_upper_threshold: 80, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 80, length_upper_threshold: 120, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 120, length_upper_threshold: 240, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 240, length_upper_threshold: 400, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 400, length_upper_threshold: 600, data_path: './trail_dataset_mistral_with_counts.pt', dataset_name: 'mistral' }
      
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 0, length_upper_threshold: 40, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 40, length_upper_threshold: 80, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 80, length_upper_threshold: 120, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 120, length_upper_threshold: 240, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 240, length_upper_threshold: 400, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 400, length_upper_threshold: 600, data_path: '/lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_gemma_with_counts.pt', dataset_name: 'gemma' }
    do:
      cmd: >
        python graph_regressor.py
        --data_path ${item.data_path}
        --output_dir results/graph_regressor_${item.edge_mode}_${item.dataset_name}_threshold${item.threshold}
        --length_threshold ${item.threshold}
        --do_eval
        --batch_size 32
        --learning_rate 1e-3
        --num_epochs 30
        --hidden_dim ${item.hidden_dim}
        --seed 42
        --use_amp
        --num_workers 4
        --edge_mode ${item.edge_mode}
        --use_wandb
        --wandb_project embeddings-length-predictor
        --length_upper_threshold ${item.length_upper_threshold}
      deps:
        - graph_regressor.py

  ablation_binned_length_thresholds:
    foreach:
      # Testing thresholds with key layers
      - { layer: 'layer_8', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_9', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 } 
      - { layer: 'layer_9', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_10', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_11', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_12', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_13', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }

      - { layer: 'layer_14', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }
      
      - { layer: 'layer_15', hidden_dim: 512, threshold: 0, length_upper_threshold: 40 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 40, length_upper_threshold: 80 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 80, length_upper_threshold: 120 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 120, length_upper_threshold: 240 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 240, length_upper_threshold: 400 }
    do:
      cmd: >
        python bines.py
        --data_path ./trail_dataset_mistral_with_counts.pt
        --layer_name ${item.layer}
        --output_dir results/binned_predictor_trail_${item.layer}_hidden${item.hidden_dim}
        --hidden_dim ${item.hidden_dim}
        --learning_rate 1e-3
        --batch_size 32
        --length_threshold ${item.threshold}
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_eval
        --early_stopping_patience 5
        --length_upper_threshold ${item.length_upper_threshold}
      deps:
        - bines.py

  ablation_binned_agg_length_thresholds:
    foreach:
      # Testing thresholds with aggregated layers
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 0 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 40 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 80 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 120 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 240 }
      
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 0 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 40 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 80 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 120 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 240 }
    do:
      cmd: >
        python bines_agg.py
        --data_path ./trail_dataset_mistral_with_counts.pt
        --layer_names ${item.layers}
        --aggregation ${item.agg}
        --output_dir results/binned_predictor_${item.agg}_layers12-15_threshold${item.threshold}
        --hidden_dim 512
        --learning_rate 1e-3
        --batch_size 32
        --length_threshold ${item.threshold}
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_eval
        --early_stopping_patience 5
      deps:
        - bines_agg.py

  train_graph_regressors:
     foreach:
       - { edge_mode: 'fully_connected', hidden_dim: 512 }
       - { edge_mode: 'fully_connected', hidden_dim: 256 }
     do:
       cmd: >
         python graph_regressor.py
         --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_llama_with_counts.pt
         --output_dir results/graph_regressor_${item.edge_mode}
         --do_eval
         --do_train
         --batch_size 16
         --learning_rate 1e-3
         --num_epochs 30
         --hidden_dim ${item.hidden_dim}
         --seed 42
         --use_amp
         --num_workers 4
         --edge_mode ${item.edge_mode}
         --use_wandb
         --wandb_project embeddings-length-predictor
       deps:
         - graph_regressor.py
         
