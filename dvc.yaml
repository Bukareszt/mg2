  train_binned_predictors_trail:
    foreach:
      - {layer: 'layer_8', hidden_dim: 512}
      - {layer: 'layer_9', hidden_dim: 512}
      - {layer: 'layer_10', hidden_dim: 512}
      - {layer: 'layer_11', hidden_dim: 512}
      - {layer: 'layer_12', hidden_dim: 512}
      - {layer: 'layer_13', hidden_dim: 512}
      - {layer: 'layer_14', hidden_dim: 512}
      - {layer: 'layer_15', hidden_dim: 512}
    do:
      cmd: >
        python bines.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name ${item.layer}
        --output_dir results/binned_predictor_trail_${item.layer}_hidden${item.hidden_dim}
        --hidden_dim ${item.hidden_dim}
        --learning_rate 1e-4
        --batch_size 32
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_eval
        --early_stopping_patience 5
      deps:
        - bines.py

  train_binned_predictors_agg:
    foreach:
      # Mean aggregation with hidden_dim variants
      # 3 layers
      # - {layers: 'layer_10 layer_11 layer_12', agg: 'mean', hidden_dim: 512}
      # - {layers: 'layer_11 layer_12 layer_13', agg: 'mean', hidden_dim: 512}
      # - {layers: 'layer_12 layer_13 layer_14', agg: 'mean', hidden_dim: 512}
      
      # # 4 layers
      # - {layers: 'layer_10 layer_11 layer_12 layer_13', agg: 'mean', hidden_dim: 512}
      # - {layers: 'layer_11 layer_12 layer_13 layer_14', agg: 'mean', hidden_dim: 512}
      # - {layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512}
      
      # # 6 layers
      # - {layers: 'layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512}

      # # 3 layers
      # - {layers: 'layer_10 layer_11 layer_12', agg: 'sum', hidden_dim: 512}
      # - {layers: 'layer_11 layer_12 layer_13', agg: 'sum', hidden_dim: 512}
      # - {layers: 'layer_12 layer_13 layer_14', agg: 'sum', hidden_dim: 512}
      
      # # 4 layers
      # - {layers: 'layer_10 layer_11 layer_12 layer_13', agg: 'sum', hidden_dim: 512}
      # - {layers: 'layer_11 layer_12 layer_13 layer_14', agg: 'sum', hidden_dim: 512}
      # - {layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512}
      
      - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512}
      - {layers: 'layer_8 layer_9 layer_10 layer_11 layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512}
    do:
      cmd: >
        python bines_agg.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_names ${item.layers}
        --aggregation ${item.agg}
        --output_dir results/binned_predictor_${item.agg}_hidden${item.hidden_dim}
        --hidden_dim ${item.hidden_dim}
        --learning_rate 1e-4
        --batch_size 32
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_train
        --do_eval
        --early_stopping_patience 5
      deps:
        - bines_agg.py

  evaluate_pia_models:
    foreach:
      - { model: "meta-llama/Meta-Llama-3-8B-Instruct", max_new_tokens: 512 }
    do:
      cmd: >
        python pia.py
        --model_id ${item.model}
        --metadata_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_metadata.pt
        --max_samples 1000
        --max_new_tokens ${item.max_new_tokens}
        --use_wandb
        --wandb_project pia-evaluator
        --wandb_name pia-${item.model}
      deps:
        - pia.py

  # Length threshold ablation studies
  ablation_graph_length_thresholds:
    foreach:
      # Testing multiple thresholds with fully connected graph
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 0 }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 40 }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 80 }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 120 }
      - { edge_mode: 'fully_connected', hidden_dim: 512, threshold: 240 }
    do:
      cmd: >
        python graph_regressor.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --output_dir results/graph_regressor_${item.edge_mode}_threshold${item.threshold}
        --length_threshold ${item.threshold}
        --do_train
        --do_eval
        --batch_size 32
        --learning_rate 1e-4
        --num_epochs 30
        --hidden_dim ${item.hidden_dim}
        --seed 42
        --use_amp
        --num_workers 4
        --edge_mode ${item.edge_mode}
        --use_wandb
        --wandb_project embeddings-length-predictor
      deps:
        - graph_regressor.py

  ablation_binned_length_thresholds:
    foreach:
      # Testing thresholds with key layers
      - { layer: 'layer_8', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_8', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_9', hidden_dim: 512, threshold: 0 } 
      - { layer: 'layer_9', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_9', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_10', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_10', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_11', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_11', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_12', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_12', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_13', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_13', hidden_dim: 512, threshold: 240 }

      - { layer: 'layer_14', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_14', hidden_dim: 512, threshold: 240 }
      
      - { layer: 'layer_15', hidden_dim: 512, threshold: 0 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 40 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 80 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 120 }
      - { layer: 'layer_15', hidden_dim: 512, threshold: 240 }
    do:
      cmd: >
        python bines.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name ${item.layer}
        --output_dir results/binned_predictor_${item.layer}_threshold${item.threshold}
        --hidden_dim ${item.hidden_dim}
        --learning_rate 1e-4
        --batch_size 32
        --length_threshold ${item.threshold}
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_train
        --do_eval
        --early_stopping_patience 5
      deps:
        - bines.py

  ablation_binned_agg_length_thresholds:
    foreach:
      # Testing thresholds with aggregated layers
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 0 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 40 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 80 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 120 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'mean', hidden_dim: 512, threshold: 240 }
      
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 0 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 40 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 80 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 120 }
      - { layers: 'layer_12 layer_13 layer_14 layer_15', agg: 'sum', hidden_dim: 512, threshold: 240 }
    do:
      cmd: >
        python bines_agg.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_names ${item.layers}
        --aggregation ${item.agg}
        --output_dir results/binned_predictor_${item.agg}_layers12-15_threshold${item.threshold}
        --hidden_dim 512
        --learning_rate 1e-4
        --batch_size 32
        --length_threshold ${item.threshold}
        --num_epochs 30
        --seed 42
        --min_loss_improvement 0.001
        --use_amp
        --use_wandb
        --wandb_project embeddings-length-predictor
        --do_train
        --do_eval
        --early_stopping_patience 5
      deps:
        - bines_agg.py

  train_graph_regressors:
     foreach:
       - { edge_mode: 'fully_connected', hidden_dim: 128 }
 #      - { edge_mode: 'sequential', hidden_dim: 128 }
       - { edge_mode: 'fully_connected', hidden_dim: 256 }
 #      - { edge_mode: 'sequential', hidden_dim: 256 }
       - { edge_mode: 'fully_connected', hidden_dim: 512 }
 #      - { edge_mode: 'sequential', hidden_dim: 512 }
     do:
       cmd: >
         python graph_regressor.py
         --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
         --output_dir results/graph_regressor_${item.edge_mode}
         --do_eval
         --batch_size 16
         --learning_rate 1e-3
         --num_epochs 30
         --hidden_dim ${item.hidden_dim}
         --seed 42
         --use_amp
         --do_train
         --num_workers 4
         --edge_mode ${item.edge_mode}
         --use_wandb
         --wandb_project embeddings-length-predictor
       deps:
         - graph_regressor.py