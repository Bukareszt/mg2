stages:
  train_bert_length_predictors:
    foreach:
      - 10
      - 50
    do:
      cmd: >
        python lenght_prediction.py
        --data_dir data/lmsys_vicuna-13b_preview0_${item}K
        --model_name google-bert/bert-base-uncased
        --output_dir results/bert_length_predictor_${item}
        --batch_size 5
        --seed 42
        --use_wandb
        --wandb_project output-length-prediction
        --do_eval
        --do_train

  generate_trail_dataset:
    cmd: >
      python generate_dataset.py
      --model meta-llama/Meta-Llama-3-8B-Instruct
      --max_length 512
      --dataset tatsu-lab/alpaca
      --split train[:1000]
      --output /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
    deps:
      - generate_dataset.py
        
  train_embeddings_predictors_trail:
    foreach:
      - 'layer_8'
      - 'layer_9'
      - 'layer_10'
      - 'layer_11'
      - 'layer_12'
      - 'layer_13'
      - 'layer_14'
      - 'layer_15'
    do:
      cmd: >
        python embedings_prediction2.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name ${item}
        --output_dir results/embeddings_predictor_trail_${item}
        --use_wandb
        --do_train
        --do_eval
        --batch_size 50
        --learning_rate 1e-5
        --num_epochs 30
        --seed 42
        --use_amp

  train_embeddings_predictors_agg:
    foreach:
      - {layers: 'layer_10 layer_11 layer_12', agg: 'mean'}
      - {layers: 'layer_11 layer_12 layer_13', agg: 'mean'}
      - {layers: 'layer_12 layer_13 layer_14', agg: 'mean'}
      - {layers: 'layer_10 layer_11 layer_12', agg: 'sum'}
      - {layers: 'layer_11 layer_12 layer_13', agg: 'sum'}
      - {layers: 'layer_12 layer_13 layer_14', agg: 'sum'}
      - {layers: 'layer_10 layer_11 layer_12', agg: 'concat'}
      - {layers: 'layer_11 layer_12 layer_13', agg: 'concat'}
      - {layers: 'layer_12 layer_13 layer_14', agg: 'concat'}
      - {layers: 'layer_10 layer_11 layer_12 layer_13', agg: 'concat'}
      - {layers: 'layer_8 layer_12 layer_15', agg: 'concat'}
    do:
      cmd: >
        python embedings_prediction.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layers ${item.layers}
        --aggregation ${item.agg}
        --output_dir results/embeddings_predictor_${item.agg}_${item.layers}
        --do_train
        --do_eval
        --use_wandb
        --wandb_project output-length-prediction
        --batch_size 15
        --learning_rate 1e-5
        --num_epochs 30
        --seed 42
        --use_amp
      deps:
        - embedings_prediction.py

  train_graph_regressors:
    foreach:
      - {layer: 'layer_10', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_11', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_12', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_13', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_14', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_15', max_seq_len: 5, threshold: 0.9}
      - {layer: 'layer_16', max_seq_len: 5, threshold: 0.9}
    do:
      cmd: >
        python graph_regressor.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name "${item.layer}"
        --threshold 0.9
        --output_dir results/graph_regressor_${item}
        --do_train
        --do_eval
        --batch_size 16
        --learning_rate 1e-3
        --num_epochs 30
        --hidden_dim 128
        --seed 42
        --use_amp
        --num_workers 4
        --max_seq_len ${item.max_seq_len}
      deps:
        - graph_regressor.py

  # Add this to test different thresholds for graph construction
  train_graph_regressors_thresholds:
    foreach:
      - {layer: 'layer_13', threshold: 0.85}
      - {layer: 'layer_13', threshold: 0.9}
      - {layer: 'layer_13', threshold: 0.95}
    do:
      cmd: >
        python graph_regressor.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name ${item.layer}
        --threshold ${item.threshold}
        --output_dir results/graph_regressor_${item.layer}_thresh${item.threshold}
        --do_train
        --do_eval
        --batch_size 16
        --learning_rate 1e-3
        --num_epochs 30
        --hidden_dim 128
        --seed 42
        --use_amp
        --num_workers 4
      deps:
        - graph_regressor.py

  # Add a multi-layer graph regressor experiment
  train_graph_regressors_multi:
    foreach:
      - {layers: ['layer_10', 'layer_13'], name: 'layer_10_13'}
      - {layers: ['layer_11', 'layer_13'], name: 'layer_11_13'}
      - {layers: ['layer_12', 'layer_13', 'layer_14'], name: 'layer_12_13_14'}
    do:
      cmd: >
        python graph_regressor.py
        --data_path /lustre/pd01/hpc-tomasznaskret-1742832160/trail_dataset_layers2.pt
        --layer_name ${item.layers[0]}
        --threshold 0.9
        --output_dir results/graph_regressor_${item.name}
        --do_train
        --do_eval
        --batch_size 16
        --learning_rate 1e-3
        --hidden_dim 256
        --num_epochs 30
        --seed 42
        --use_amp
        --num_workers 4
      deps:
        - graph_regressor.py